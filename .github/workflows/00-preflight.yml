name: A31 Port Lab - Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  preflight:   build-kernel:
    name: Build A31 Kernel Image
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show source identity
        shell: bash
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          echo "BRANCH=$(git branch --show-current)"
          echo "KERNEL_VERSION=$(make -s kernelversion || true)"
          echo "ARCH=$(uname -m)"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            device-tree-compiler \
            python3 \
            rsync \
            unzip \
            xz-utils \
            zip

      - name: Configure ccache
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/ccache"
          ccache --set-config=cache_dir="$HOME/.cache/ccache"
          ccache --set-config=max_size=2G
          ccache --zero-stats
          ccache --show-config

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.HOME }}/.cache/ccache
          key: ${{ runner.os }}-a31-kernel-ccache-${{ hashFiles('Makefile', 'arch/arm64/configs/a31_defconfig') }}
          restore-keys: |
            ${{ runner.os }}-a31-kernel-ccache-

      - name: Detect A31 configuration
        shell: bash
        run: |
          test -f arch/arm64/configs/a31_defconfig

          echo "A31 defconfig:"
          echo "arch/arm64/configs/a31_defconfig"

          echo ""
          echo "BPF configuration entries:"
          grep -E '^CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|CGROUP_BPF)' \
            arch/arm64/configs/a31_defconfig || true

      - name: Prepare kernel configuration
        shell: bash
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" a31_defconfig

          echo ""
          echo "Generated BPF configuration:"
          grep -E '^CONFIG_(BPF|BPF_SYSCALL|BPF_JIT|BPF_EVENTS|CGROUP_BPF)' \
            .config || true

      - name: Check kernel version and target state
        shell: bash
        run: |
          KVER="$(make -s kernelversion)"

          echo "KERNEL_VERSION=$KVER" | tee build-version.txt

          if [[ "$KVER" == 4.14.356* ]]; then
            echo "TARGET_BASE=4.14.356-openela-compatible"
          else
            echo "TARGET_BASE=INTERMEDIATE_A31_TREE"
            echo "NOTE=Current tree is not yet the final 4.14.356-openela base."
          fi

      - name: Build kernel
        shell: bash
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          KCFLAGS: -fgnu89-inline
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-runner
        run: |
          set -o pipefail

          mkdir -p out

          make \
            O=out \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            KCFLAGS="$KCFLAGS" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" \
            KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            -j"$(nproc)" \
            Image.gz \
            dtbs \
            2>&1 | tee build.log

      - name: Locate kernel and MT6768 DTB
        shell: bash
        run: |
          test -f out/arch/arm64/boot/Image.gz

          DTB="$(find out/arch/arm64/boot -type f -name 'mt6768.dtb' -print -quit)"

          if [ -z "$DTB" ]; then
            echo "ERROR: mt6768.dtb was not produced."
            echo "Available DTBs:"
            find out/arch/arm64/boot -type f -name '*.dtb' -print | sort || true
            exit 1
          fi

          echo "DTB=$DTB" | tee dtb-location.txt

          cp out/arch/arm64/boot/Image.gz Image.gz
          cp "$DTB" mt6768.dtb

      - name: Create kernel image artifacts
        shell: bash
        run: |
          cat Image.gz mt6768.dtb > Image.gz-dtb
          cp Image.gz-dtb kernel.img

          echo "Kernel files:"
          ls -lh \
            Image.gz \
            mt6768.dtb \
            Image.gz-dtb \
            kernel.img

      - name: Build metadata
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            echo "kernel_version=$(make -s kernelversion)"
            echo "defconfig=a31_defconfig"
            echo "arch=arm64"
            echo "compiler=aarch64-linux-gnu-gcc"
            echo "kcflags=-fgnu89-inline"
          } > build-metadata.txt

          echo ""
          cat build-metadata.txt

      - name: Validate generated files
        shell: bash
        run: |
          test -s Image.gz
          test -s mt6768.dtb
          test -s Image.gz-dtb
          test -s kernel.img

          echo ""
          echo "Image.gz:"
          file Image.gz

          echo ""
          echo "DTB:"
          file mt6768.dtb

          echo ""
          echo "Kernel image:"
          file kernel.img

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: A31-kernel-candidate-${{ github.sha }}
          path: |
            Image.gz
            mt6768.dtb
            Image.gz-dtb
            kernel.img
            build.log
            build-version.txt
            build-metadata.txt
            dtb-location.txt
          if-no-files-found: error
          retention-days: 7
    runs-on: ubuntu-latest

    steps:
      - name: Show runner information
        run: |
          uname -a
          lscpu
          free -h
          df -h

      - name: Check required tools
        run: |
          git --version
          python3 --version
          gcc --version
          clang --version || true
          make --version
          tar --version
          xz --version
          zstd --version || true
          lz4 --version || true
          cpio --version

      - name: Test workspace
        run: |
          mkdir -p work
          echo "A31/A32 port lab preflight OK" > work/status.txt
          cat work/status.txt

      - name: Report disk usage
        run: |
          df -h
          du -sh work
