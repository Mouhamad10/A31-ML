name: Discover A34 One UI 8 APEX targets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DONOR_REPO: https://gitlab.com/oifaaahyeah/a34xdxx-user-16-BP2A.250605.031.A3-A346EXXUAEYI7-release-keys.git

    steps:
      - name: Show runner environment
        shell: bash
        run: |
          set -e
          git --version
          df -h

      - name: Install Git LFS
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Clone donor metadata only
        shell: bash
        run: |
          set -e
          git clone --depth=1 --filter=blob:none --no-checkout "$DONOR_REPO" donor
          cd donor
          git lfs install
          git rev-parse HEAD
          git branch --show-current
          git ls-tree -r --name-only HEAD > ../donor-tree.txt

      - name: Build discovery report
        shell: bash
        run: |
          set -e
          mkdir -p report

          {
            echo "DONOR_REPO=$DONOR_REPO"
            echo
            echo "=== Total tracked paths ==="
            wc -l donor-tree.txt
            echo
            echo "=== Tethering matches ==="
            grep -i tethering donor-tree.txt || true
            echo
            echo "=== Media matches ==="
            grep -i media donor-tree.txt || true
            echo
            echo "=== APEX matches ==="
            grep -i apex donor-tree.txt || true
            echo
            echo "=== Connectivity matches ==="
            grep -i connectivity donor-tree.txt || true
            echo
            echo "=== Exact target-like matches ==="
            grep -Ei 'com.(android|google.android).(tethering|media|media.swcodec).*.(apex|capex)$' donor-tree.txt || true
          } > report/discovery.txt

          cp donor-tree.txt report/donor-tree.txt

          git -C donor rev-parse HEAD > report/donor-head.txt
          git -C donor log -1 --format=fuller > report/donor-head-commit.txt

          ls -lh report
          cat report/discovery.txt

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: a34-donor-discovery
          path: report
          if-no-files-found: error
          retention-days: 3
