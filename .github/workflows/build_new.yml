name: Build Lucreticus Kernel (A31 – new workflow)

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # إتاحته للتشغيل اليدوي من صفحة Actions

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🛠 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            clang-14 \
            make \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            ccache \
            zip

      - name: 📂 Prepare build environment
        run: |
          # تفعيل ccache لتقليل زمن البناء في المرات المتتالية
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          export CCACHE_DIR=$HOME/.ccache
          # إعطاء صلاحية التنفيذ للسكريبت
          chmod +x ./build_lucreticus.sh

      - name: 🚀 Run build script
        env:
          # يمكنك إضافة متغيرات إذا احتجت لتخصيص النسخة أو الإعدادات
          # EXAMPLE_VAR: ${{ secrets.EXAMPLE_VAR }}
        run: |
          # تقليل عدد الـ jobs لتفادي استهلاك الذاكرة في runner الصغير
          ./build_lucreticus.sh

      - name: 📦 Archive compiled kernel
        if: success()
        run: |
          cd out/arch/arm64/boot
          zip -9 lucreticus_a31_bpf5.15.zip Image.gz-dtb
          echo "ARTIFACT_PATH=$(pwd)/lucreticus_a31_bpf5.15.zip" >> $GITHUB_ENV

      - name: 📤 Upload artifact
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: lucreticus_a31_bpf5.15
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 30   # يبقى الـ artifact 30 يومًا
