name: A31 Kernel Build Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Samsung A31 Kernel
    runs-on: ubuntu-latest

    steps:

      - name: Checkout A31 kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show repository
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"
          ls -lah

          echo
          echo "Kernel Makefile:"
          test -f Makefile
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' Makefile || true

          echo
          echo "Architecture:"
          test -d arch/arm64
          echo "arm64 source found"

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libssl-dev \
            lz4 \
            openssl \
            python3 \
            unzip \
            xz-utils \
            zip

      - name: Prepare Proton Clang
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang \
            "$GITHUB_WORKSPACE/toolchain/proton-clang"

          echo "$GITHUB_WORKSPACE/toolchain/proton-clang/bin" >> "$GITHUB_PATH"

      - name: Show defconfig candidates
        shell: bash
        run: |
          set -e

          echo "Defconfig files:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      - name: Detect A31 defconfig
        shell: bash
        run: |
          set -e

          DEFCONFIG=""

          for candidate in \
            a31_defconfig \
            a315_defconfig \
            a315f_defconfig \
            mt6768_defconfig \
            mt6768_defconfig_a31
          do
            if test -f "arch/arm64/configs/$candidate"; then
              DEFCONFIG="$candidate"
              break
            fi
          done

          if test -z "$DEFCONFIG"; then
            echo "No automatic A31 defconfig was found."
            echo
            echo "Available candidates:"
            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort \
              | head -200

            exit 2
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"
          echo "Selected defconfig: $DEFCONFIG"

      - name: Prepare kernel configuration
        shell: bash
        run: |
          set -e

          mkdir -p out

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            "$DEFCONFIG"

      - name: Build kernel
        shell: bash
        run: |
          set -e

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)"

      - name: Verify kernel output
        shell: bash
        run: |
          set -e

          echo "Boot output:"
          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            | sort

          if test -f out/arch/arm64/boot/Image; then
            echo "Image found"
          elif test -f out/arch/arm64/boot/Image.gz; then
            echo "Image.gz found"
          elif test -f out/arch/arm64/boot/Image.gz-dtb; then
            echo "Image.gz-dtb found"
          else
            echo "No kernel image found"
            exit 3
          fi

      - name: Collect build information
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          cp out/.config artifact/kernel.config

          if test -f out/arch/arm64/boot/Image; then
            cp out/arch/arm64/boot/Image artifact/
          fi

          if test -f out/arch/arm64/boot/Image.gz; then
            cp out/arch/arm64/boot/Image.gz artifact/
          fi

          if test -f out/arch/arm64/boot/Image.gz-dtb; then
            cp out/arch/arm64/boot/Image.gz-dtb artifact/
          fi

          {
            echo "Repository=$GITHUB_REPOSITORY"
            echo "Commit=$GITHUB_SHA"
            echo "Ref=$GITHUB_REF_NAME"
            echo "Defconfig=$DEFCONFIG"
            echo "KernelVersion=$(make -s O=out kernelversion)"
          } > artifact/build-info.txt

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A31-kernel-build-test
          path: artifact/
          if-no-files-found: error
          retention-days: 7
